name: Bygg og publiser filmsøk.no

# Dette repoet inneholder bare denne workflowen. Selve koden ligger i et
# privat repo og hentes med en skrivebeskyttet deploy key.

on:
  schedule:
    - cron: "0 4 * * *"   # hver natt 04:00 UTC (06:00 norsk sommertid)
  workflow_dispatch:       # manuell kjøring: gh workflow run build.yml -R nilidesign/filmsok-site
    inputs:
      indexnow_all:
        description: "Si fra til Bing om ALLE sidene (ellers bare oversiktssider og nye sider)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120    # et heng skal ikke brenne timer
    steps:
      - name: Hent kilden (privat repo)
        uses: actions/checkout@v4
        with:
          repository: nilidesign/filmsok
          ref: main
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bygg siden
        working-directory: src
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Valgfri: bedre norske handlingsreferat via DeepL. Tom = av.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          SITE_URL: https://filmsok.no
          WORKERS: "16"
          MAX_MOVIES: "100000"
          # Gårsdagens data/avail.json hentes fra nettsiden og gir «nytt på Netflix».
          # Feiler henting (ikke 404), avbrytes bygget i stedet for å miste historikken.
          REQUIRE_PREV_AVAIL: "1"
        run: python3 scripts/build.py

      - name: Stage det som skal publiseres
        run: |
          mkdir -p _site
          # Kopier ALT unntatt kilde og verktøy, så en ny sidetype ikke kan glemmes.
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.claude' \
            --exclude 'scripts' --exclude '_site' \
            --exclude 'README.md' --exclude 'tmdb-email.md' \
            --exclude 'bygg.sh' --exclude '.gitignore' \
            src/ _site/
          test -f _site/index.html || { echo "::error::index.html mangler"; exit 1; }
          test -d _site/film     || { echo "::error::film/ mangler"; exit 1; }
          pages=$(find _site -name index.html | wc -l)
          echo "Publiserer $pages sider"
          [ "$pages" -ge 50 ] || { echo "::error::bare $pages sider"; exit 1; }
          # GitHub Pages tåler ca. 1 GB. --apparent-size måler faktiske bytes.
          mb=$(du -sm --apparent-size _site | cut -f1)
          echo "Størrelse: ${mb} MB"
          [ "$mb" -lt 950 ] || { echo "::error::${mb} MB er for nær Pages-grensen på 1 GB."; exit 1; }

      - name: Lag IndexNow-lister (sendes etter publisering)
        continue-on-error: true
        run: |
          python3 src/scripts/indexnow.py --site _site --live https://filmsok.no --out indexnow \
            ${{ inputs.indexnow_all && '--all' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Gir Bing (og andre IndexNow-søkemotorer) beskjed når siden er live. Feiler
  # dette, skal ikke publiseringen regnes som mislykket.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
          path: indexnow
      - name: Send til IndexNow
        run: |
          sleep 60    # la siden og nøkkelfilen bli tilgjengelig først
          shopt -s nullglob
          files=(indexnow/indexnow-*.json)
          [ ${#files[@]} -gt 0 ] || { echo "Ingenting å sende"; exit 0; }
          for f in "${files[@]}"; do
            n=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['urlList']))" "$f")
            code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary "@$f")
            echo "$f: $n adresser -> HTTP $code $(head -c 200 resp.txt)"
            case "$code" in 200|202) ;; *) exit 1 ;; esac
          done

  # GitHub slår av planlagte kjøringer i offentlige repoer etter 60 dager uten
  # aktivitet. Dette repoet får sjelden commits, så vi lager en tom commit når
  # den siste er over 30 dager gammel.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Hold nattbygget aktivt
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          echo "Siste commit er $(( age / 86400 )) dager gammel"
          if [ "$age" -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Hold planlagte kjøringer aktive"
            git push
          fi
